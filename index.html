<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#071b23">
  <title>Odyssée — Légendes de l’Égée v1.03.1</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b23;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
    #game{width:100%;height:100%}
    canvas{display:block}
    #loading{position:fixed;inset:0;display:grid;place-items:center;color:#f4df9b;background:#071b23;z-index:10;font-weight:800;letter-spacing:.08em}
  </style>
</head>
<body>
<div id="loading">CHARGEMENT DE L’ÉGÉE…</div>
<div id="game"></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script>
(() => {
  "use strict";

  const WORLD_W = 2400, WORLD_H = 1800;
  const clamp = Phaser.Math.Clamp;

  class MainScene extends Phaser.Scene {
    constructor(){ super("MainScene"); }

    create(){
      document.getElementById("loading").style.display = "none";
      this.mode = "land";
      this.speed = 210;
      this.shipSpeed = 270;
      this.joy = {x:0,y:0,active:false,pointerId:null};
      this.coins = 120;
      this.wood = 8;
      this.food = 16;

      this.physics.world.setBounds(0,0,WORLD_W,WORLD_H);
      this.cameras.main.setBounds(0,0,WORLD_W,WORLD_H);
      this.cameras.main.setBackgroundColor("#082b36");

      this.drawWorld();
      this.createActors();
      this.createUI();
      this.createJoystick();
      this.createActionButton();

      this.cameras.main.startFollow(this.player, true, 0.09, 0.09);
      this.cameras.main.setZoom(this.scale.width < 500 ? 1.16 : 1.0);
      this.scale.on("resize", () => this.layoutUI());

      this.input.keyboard?.on("keydown-E", () => this.doAction());
      this.input.keyboard?.addKeys("W,A,S,D,UP,DOWN,LEFT,RIGHT");
      this.toast("Explore Ithaque puis rejoins le navire");
    }

    drawWorld(){
      const g = this.add.graphics();

      // Mer profonde
      g.fillStyle(0x082b36,1).fillRect(0,0,WORLD_W,WORLD_H);

      // Courants / variations d’eau
      for(let i=0;i<160;i++){
        const x = Phaser.Math.Between(0,WORLD_W);
        const y = Phaser.Math.Between(0,WORLD_H);
        const w = Phaser.Math.Between(25,100);
        g.lineStyle(2, i%3===0 ? 0x174956 : 0x0d3945, .35);
        g.beginPath(); g.moveTo(x,y); g.lineTo(x+w,y+Phaser.Math.Between(-8,8)); g.strokePath();
      }

      // Île irrégulière : plusieurs ellipses superposées, sans grille.
      g.fillStyle(0x3c6f55,1);
      const islandParts = [
        [620,770,830,690],[900,660,720,620],[1120,820,660,720],
        [760,1030,650,520],[1160,1080,550,440],[480,980,360,350]
      ];
      islandParts.forEach(p=>g.fillEllipse(...p));

      // Plage périphérique visuelle
      g.lineStyle(48,0xcdb77b,1);
      g.beginPath();
      g.moveTo(290,750);
      g.bezierCurveTo(330,390,790,310,1190,440);
      g.bezierCurveTo(1510,540,1510,1030,1260,1310);
      g.bezierCurveTo(1020,1510,520,1430,300,1170);
      g.bezierCurveTo(170,1020,180,850,290,750);
      g.strokePath();

      // Re-remplissage intérieur pour garder une côte fine
      g.fillStyle(0x4f815e,1);
      g.beginPath();
      g.moveTo(305,750);
      g.bezierCurveTo(350,430,790,345,1175,470);
      g.bezierCurveTo(1450,565,1465,1015,1230,1280);
      g.bezierCurveTo(1010,1450,550,1390,330,1150);
      g.bezierCurveTo(210,1010,210,850,305,750);
      g.closePath(); g.fillPath();

      // Chemins organiques
      g.lineStyle(54,0xb89d61,1);
      g.beginPath(); g.moveTo(470,1120); g.bezierCurveTo(620,1000,760,900,940,760); g.strokePath();
      g.beginPath(); g.moveTo(930,760); g.bezierCurveTo(1090,720,1200,760,1320,880); g.strokePath();
      g.beginPath(); g.moveTo(800,900); g.bezierCurveTo(720,770,660,650,610,540); g.strokePath();

      // Falaises et collines
      for(let i=0;i<26;i++){
        const x=Phaser.Math.Between(430,1280), y=Phaser.Math.Between(480,1280);
        if(i%2===0){
          g.fillStyle(0x365e48,1).fillEllipse(x,y,Phaser.Math.Between(80,170),Phaser.Math.Between(45,90));
          g.fillStyle(0x6f9165,.55).fillEllipse(x-10,y-12,Phaser.Math.Between(45,110),Phaser.Math.Between(20,45));
        }
      }

      // Port
      g.fillStyle(0x6c4d2d,1).fillRect(350,1110,270,38);
      g.fillRect(520,1080,38,150);
      g.fillStyle(0x9b7444,1);
      for(let x=360;x<610;x+=35) g.fillRect(x,1116,4,26);

      // Bâtiments extérieurs, non visitables
      this.buildings = [
        {x:720,y:845,w:150,h:105,name:"Forgeron"},
        {x:1030,y:680,w:165,h:115,name:"Marché"},
        {x:860,y:530,w:190,h:125,name:"Temple"}
      ];
      this.buildings.forEach((b,i)=>{
        g.fillStyle(i===2?0xd8cfad:0xd9c28f,1).fillRoundedRect(b.x,b.y,b.w,b.h,8);
        g.fillStyle(i===2?0xb7aa82:0x9a6238,1).fillTriangle(b.x-10,b.y+8,b.x+b.w/2,b.y-58,b.x+b.w+10,b.y+8);
        g.fillStyle(0x4c3224,1).fillRect(b.x+b.w/2-15,b.y+b.h-42,30,42);
      });

      // Arbres / rochers
      for(let i=0;i<50;i++){
        const x=Phaser.Math.Between(330,1330), y=Phaser.Math.Between(430,1320);
        if((x>650&&x<1220&&y>480&&y<980) || (x<650&&y>1040)) continue;
        g.fillStyle(0x65452a,1).fillRect(x-5,y,10,25);
        g.fillStyle(0x28503a,1).fillCircle(x,y-10,20);
        g.fillStyle(0x3f7550,.8).fillCircle(x-10,y-14,12);
      }

      // Zone collision approximative de l’île
      this.landZone = new Phaser.Geom.Ellipse(820,900,1180,980);
      this.dockPoint = new Phaser.Math.Vector2(510,1085);
      this.shipPoint = new Phaser.Math.Vector2(490,1225);
    }

    createActors(){
      // Navire procédural
      const sg = this.make.graphics({x:0,y:0,add:false});
      sg.fillStyle(0x6d3e22).fillEllipse(42,28,82,34);
      sg.fillStyle(0x9a6334).fillTriangle(4,25,80,25,42,54);
      sg.fillStyle(0xe8ddbb).fillTriangle(42,25,42,-18,73,20);
      sg.lineStyle(4,0x3b2518).lineBetween(42,-22,42,28);
      sg.generateTexture("ship",86,64); sg.destroy();

      // Héros procédural, pixel-like
      const pg = this.make.graphics({x:0,y:0,add:false});
      pg.fillStyle(0x20252a).fillCircle(18,10,9);
      pg.fillStyle(0xd5a06f).fillCircle(18,17,8);
      pg.fillStyle(0xb94b39).fillRect(9,24,18,21);
      pg.fillStyle(0xe3c47d).fillRect(7,44,8,16);
      pg.fillRect(21,44,8,16);
      pg.fillStyle(0x61402a).fillRect(4,28,5,22);
      pg.generateTexture("hero",36,64); pg.destroy();

      this.ship = this.physics.add.image(this.shipPoint.x,this.shipPoint.y,"ship")
        .setDepth(20).setImmovable(true);
      this.ship.body.setCircle(25,18,7);

      this.player = this.physics.add.image(520,1045,"hero")
        .setDepth(30).setCollideWorldBounds(true);
      this.player.body.setCircle(15,3,26);

      this.physics.add.collider(this.player,this.ship);
    }

    createUI(){
      const style = {fontFamily:"system-ui",fontSize:"16px",color:"#f7e6ae",fontStyle:"bold"};
      this.hudBg = this.add.rectangle(12,12,230,66,0x071b23,.78).setOrigin(0).setScrollFactor(0).setDepth(1000);
      this.hud = this.add.text(24,22,"",style).setScrollFactor(0).setDepth(1001);
      this.modeText = this.add.text(24,50,"", {...style,fontSize:"13px",color:"#a9d8d0"}).setScrollFactor(0).setDepth(1001);

      this.messageBg = this.add.rectangle(0,0,10,10,0x071b23,.88).setScrollFactor(0).setDepth(1000).setVisible(false);
      this.message = this.add.text(0,0,"",{fontFamily:"system-ui",fontSize:"15px",color:"#ffffff",align:"center",wordWrap:{width:300}})
        .setOrigin(.5).setScrollFactor(0).setDepth(1001).setVisible(false);

      this.layoutUI();
    }

    createJoystick(){
      this.joyBase = this.add.circle(92,this.scale.height-105,66,0x071b23,.58)
        .setStrokeStyle(3,0xe5d08d,.75).setScrollFactor(0).setDepth(1100).setInteractive();
      this.joyKnob = this.add.circle(92,this.scale.height-105,29,0xe5d08d,.82)
        .setScrollFactor(0).setDepth(1101);

      const start = p => {
        if(p.x > this.scale.width*.55) return;
        this.joy.active=true; this.joy.pointerId=p.id;
        this.updateJoy(p);
      };
      const move = p => { if(this.joy.active && p.id===this.joy.pointerId) this.updateJoy(p); };
      const end = p => {
        if(p.id!==this.joy.pointerId) return;
        this.joy.active=false; this.joy.pointerId=null; this.joy.x=this.joy.y=0;
        this.joyKnob.setPosition(this.joyBase.x,this.joyBase.y);
      };
      this.input.on("pointerdown",start);
      this.input.on("pointermove",move);
      this.input.on("pointerup",end);
      this.input.on("pointerupoutside",end);
    }

    updateJoy(p){
      const dx=p.x-this.joyBase.x, dy=p.y-this.joyBase.y;
      const len=Math.hypot(dx,dy)||1, max=48;
      const dist=Math.min(len,max);
      const nx=dx/len, ny=dy/len;
      this.joy.x=nx*(dist/max); this.joy.y=ny*(dist/max);
      this.joyKnob.setPosition(this.joyBase.x+nx*dist,this.joyBase.y+ny*dist);
    }

    createActionButton(){
      this.action = this.add.circle(this.scale.width-82,this.scale.height-105,55,0x9d3b32,.86)
        .setStrokeStyle(3,0xf5dda0,1).setScrollFactor(0).setDepth(1100).setInteractive();
      this.actionLabel = this.add.text(this.action.x,this.action.y,"ACTION",{
        fontFamily:"system-ui",fontSize:"13px",fontStyle:"bold",color:"#fff"
      }).setOrigin(.5).setScrollFactor(0).setDepth(1101);
      this.action.on("pointerdown",()=>this.doAction());
    }

    layoutUI(){
      if(!this.joyBase) return;
      const h=this.scale.height,w=this.scale.width;
      this.joyBase.setPosition(92,h-105); this.joyKnob.setPosition(this.joyBase.x,this.joyBase.y);
      this.action.setPosition(w-82,h-105); this.actionLabel.setPosition(this.action.x,this.action.y);
      this.messageBg.setPosition(w/2,112).setSize(Math.min(340,w-30),62);
      this.message.setPosition(w/2,112);
    }

    doAction(){
      if(this.mode==="land"){
        const d=Phaser.Math.Distance.Between(this.player.x,this.player.y,this.ship.x,this.ship.y);
        if(d<115){
          this.mode="sea";
          this.player.setVisible(false).body.enable=false;
          this.ship.body.immovable=false;
          this.cameras.main.startFollow(this.ship,true,.08,.08);
          this.toast("Embarquement — navigue librement");
          return;
        }
        const nearForge=Phaser.Math.Distance.Between(this.player.x,this.player.y,795,900)<120;
        if(nearForge){
          if(this.coins>=50){this.coins-=50;this.toast("Épée de bronze équipée — 50 drachmes");}
          else this.toast("Il te faut 50 drachmes");
          return;
        }
        this.toast("Approche-toi du navire ou du forgeron");
      } else {
        const d=Phaser.Math.Distance.Between(this.ship.x,this.ship.y,this.dockPoint.x,this.dockPoint.y);
        if(d<135){
          this.mode="land";
          this.ship.setVelocity(0,0);
          this.ship.body.immovable=true;
          this.player.setPosition(520,1045).setVisible(true); this.player.body.enable=true;
          this.cameras.main.startFollow(this.player,true,.09,.09);
          this.toast("Débarquement à Ithaque");
        } else this.toast("Reviens près du ponton pour débarquer");
      }
    }

    toast(txt){
      this.message.setText(txt).setVisible(true);
      this.messageBg.setVisible(true);
      clearTimeout(this.toastTimer);
      this.toastTimer=setTimeout(()=>{
        if(this.message){this.message.setVisible(false);this.messageBg.setVisible(false);}
      },2200);
    }

    update(){
      const keys=this.input.keyboard;
      let x=this.joy.x, y=this.joy.y;
      if(keys){
        if(keys.keys[Phaser.Input.Keyboard.KeyCodes.A]?.isDown || keys.keys[Phaser.Input.Keyboard.KeyCodes.LEFT]?.isDown) x=-1;
        if(keys.keys[Phaser.Input.Keyboard.KeyCodes.D]?.isDown || keys.keys[Phaser.Input.Keyboard.KeyCodes.RIGHT]?.isDown) x=1;
        if(keys.keys[Phaser.Input.Keyboard.KeyCodes.W]?.isDown || keys.keys[Phaser.Input.Keyboard.KeyCodes.UP]?.isDown) y=-1;
        if(keys.keys[Phaser.Input.Keyboard.KeyCodes.S]?.isDown || keys.keys[Phaser.Input.Keyboard.KeyCodes.DOWN]?.isDown) y=1;
      }
      const len=Math.hypot(x,y);
      if(len>1){x/=len;y/=len;}

      if(this.mode==="land"){
        this.player.setVelocity(x*this.speed,y*this.speed);
        if(Math.abs(x)>.05) this.player.setFlipX(x<0);

        // Limite organique simplifiée : empêche d’aller dans la mer.
        if(!this.landZone.contains(this.player.x,this.player.y)){
          const c=new Phaser.Math.Vector2(820,900);
          const p=new Phaser.Math.Vector2(this.player.x,this.player.y);
          p.subtract(c).normalize();
          this.player.setPosition(this.player.x-p.x*7,this.player.y-p.y*7);
          this.player.setVelocity(0,0);
        }

        // Collisions simples bâtiments.
        this.buildings.forEach(b=>{
          const r=new Phaser.Geom.Rectangle(b.x-18,b.y-70,b.w+36,b.h+90);
          if(r.contains(this.player.x,this.player.y)){
            this.player.x-=x*8; this.player.y-=y*8;
            this.player.setVelocity(0,0);
          }
        });
      } else {
        this.ship.setVelocity(x*this.shipSpeed,y*this.shipSpeed);
        if(len>.08){
          this.ship.rotation=Math.atan2(y,x)+Math.PI/2;
        }
        // Le bateau ne traverse pas l’île.
        if(this.landZone.contains(this.ship.x,this.ship.y) && Phaser.Math.Distance.Between(this.ship.x,this.ship.y,this.shipPoint.x,this.shipPoint.y)>150){
          this.ship.x-=x*10;this.ship.y-=y*10;this.ship.setVelocity(0,0);
        }
      }

      this.hud.setText(`◈ ${this.coins}   🍞 ${this.food}   🪵 ${this.wood}`);
      this.modeText.setText(this.mode==="land" ? "ITHAQUE — À PIED" : "MER IONIENNE — À BORD");
    }
  }

  const config = {
    type: Phaser.AUTO,
    parent: "game",
    backgroundColor: "#071b23",
    scale: {mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH, width: window.innerWidth, height: window.innerHeight},
    physics: {default:"arcade", arcade:{gravity:{x:0,y:0},debug:false}},
    render: {antialias:false, pixelArt:true, roundPixels:true},
    scene: [MainScene]
  };

  new Phaser.Game(config);
})();
</script>
</body>
</html>
