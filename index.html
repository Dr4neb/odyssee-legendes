<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#06171e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Odyssée — Légendes de l’Égée v1.05</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06171e;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
    #game{width:100%;height:100%}
    canvas{display:block}
    #boot{position:fixed;inset:0;display:grid;place-items:center;background:#06171e;color:#f4df9b;z-index:100;font-weight:800;letter-spacing:.08em}
    #titleScreen{
      position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;
      align-items:center;justify-content:center;padding:calc(28px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 50% 38%, rgba(34,84,96,.25), transparent 32%),
        repeating-linear-gradient(0deg,transparent 0 61px,rgba(24,77,89,.22) 62px 65px),
        #06171e;
      color:white;text-align:center;box-sizing:border-box;
    }
    #titleScreen.hidden{display:none}
    .gameTitle{
      margin:0;color:#f2d58a;font:900 clamp(48px,14vw,74px)/.95 Georgia,serif;
      text-shadow:-3px 0 #301e13,0 3px #301e13,3px 0 #301e13,0 -3px #301e13,0 8px 0 rgba(0,0,0,.35);
    }
    .gameSubtitle{margin:24px 0 0;color:#d5e0de;font-size:clamp(17px,5vw,23px);font-weight:900;letter-spacing:.2em}
    .gameVersion{margin:48px 0 0;color:#819ba0;font-size:15px;font-weight:800}
    #startButton{
      width:min(86vw,360px);min-height:72px;margin-top:54px;border:4px solid #f1d889;border-radius:2px;
      background:#98483a;color:#fff;font:900 22px system-ui,-apple-system,sans-serif;
      box-shadow:0 7px 0 #50251e;touch-action:manipulation;-webkit-appearance:none;appearance:none;
    }
    #startButton:active{transform:translateY(4px);box-shadow:0 3px 0 #50251e}
    #eraseButton{
      margin-top:30px;padding:12px 18px;border:0;background:transparent;color:#b7c5c5;
      font:600 15px system-ui,-apple-system,sans-serif;touch-action:manipulation;
    }
    .credit{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));color:#637a7e;font-size:13px}
    #fatalError{
      display:none;position:fixed;inset:0;z-index:200;padding:40px 24px;background:#260d0d;color:#fff;
      white-space:pre-wrap;overflow:auto;font:15px/1.5 monospace;
    }
    #rotateHint{
      display:none;position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;z-index:1600;
      transform:translateX(-50%);padding:9px 14px;border:1px solid rgba(241,216,137,.8);
      border-radius:999px;background:rgba(6,23,30,.92);color:#f4df9b;
      font:800 12px system-ui,-apple-system,sans-serif;pointer-events:none;white-space:nowrap;
    }
    #mobileControls{display:none;position:fixed;inset:0;z-index:1500;pointer-events:none}
    #mobileControls.visible{display:block}
    #joystickBase{
      position:absolute;left:calc(28px + env(safe-area-inset-left));bottom:calc(24px + env(safe-area-inset-bottom));
      width:142px;height:142px;border:4px solid rgba(229,207,135,.9);border-radius:50%;
      background:rgba(6,23,30,.58);box-shadow:inset 0 0 0 2px rgba(255,255,255,.05);
      pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;
    }
    #joystickKnob{
      position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;
      background:rgba(229,207,135,.92);box-shadow:0 5px 14px rgba(0,0,0,.35);pointer-events:none;transform:translate3d(0,0,0);
    }
    .domGameButton{
      position:absolute;right:calc(30px + env(safe-area-inset-right));border-radius:50%;
      display:grid;place-items:center;border:4px solid #f1d889;color:#fff;font-weight:900;
      pointer-events:auto;touch-action:manipulation;-webkit-user-select:none;user-select:none;
      box-shadow:0 7px 16px rgba(0,0,0,.35);
    }
    #domActionButton{
      bottom:calc(25px + env(safe-area-inset-bottom));width:124px;height:124px;background:rgba(158,63,50,.92);font-size:18px;
    }
    #domInventoryButton{
      right:calc(58px + env(safe-area-inset-right));bottom:calc(166px + env(safe-area-inset-bottom));
      width:62px;height:62px;border-width:3px;background:rgba(37,78,86,.95);font-size:25px;
    }
    .domGameButton:active{transform:scale(.94)}
    @media (orientation:portrait){
      #rotateHint{display:block}
      #joystickBase{width:132px;height:132px;left:18px;bottom:calc(18px + env(safe-area-inset-bottom))}
      #domActionButton{width:116px;height:116px;right:18px;bottom:calc(18px + env(safe-area-inset-bottom))}
      #domInventoryButton{right:45px;bottom:calc(152px + env(safe-area-inset-bottom))}
    }
    @media (orientation:landscape) and (max-height:500px){
      #joystickBase{width:124px;height:124px;left:calc(20px + env(safe-area-inset-left));bottom:calc(15px + env(safe-area-inset-bottom))}
      #joystickKnob{width:56px;height:56px;margin:-28px 0 0 -28px}
      #domActionButton{width:106px;height:106px;right:calc(22px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));font-size:16px}
      #domInventoryButton{width:54px;height:54px;right:calc(48px + env(safe-area-inset-right));bottom:calc(132px + env(safe-area-inset-bottom))}
    }
  </style>
</head>
<body>
<div id="boot">OUVERTURE DES PORTES D’ITHAQUE…</div>
<div id="titleScreen">
  <h1 class="gameTitle">ODYSSÉE</h1>
  <div class="gameSubtitle">LÉGENDES DE L’ÉGÉE</div>
  <div class="gameVersion">ALPHA v1.05</div>
  <button id="startButton" type="button">COMMENCER</button>
  <button id="eraseButton" type="button">Effacer la sauvegarde</button>
  <div class="credit">Prototype mobile — Dr4neb</div>
</div>
<div id="fatalError"></div>
<div id="rotateHint">↻ Tourne l’iPhone en paysage</div>
<div id="mobileControls">
  <div id="joystickBase" aria-label="Joystick de déplacement"><div id="joystickKnob"></div></div>
  <button id="domInventoryButton" class="domGameButton" type="button" aria-label="Inventaire">🎒</button>
  <button id="domActionButton" class="domGameButton" type="button">ACTION</button>
</div>
<div id="game"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script>
(() => {
"use strict";

const W=2600,H=1900;
const SAVE_KEY="odyssee_v105_alpha";

class BootScene extends Phaser.Scene{
  constructor(){super("Boot")}
  create(){ document.getElementById("boot").style.display="none"; }
}

class WorldScene extends Phaser.Scene{
  constructor(){super("World")}
  create(){
    this.mode="land";
    this.speed=235;
    this.shipSpeed=290;
    this.coins=120;
    this.food=18;
    this.wood=10;
    this.inventory={sword:false,shield:false,helmet:false};
    this.joy={x:0,y:0,active:false,id:null};
    this.dayT=0;
    this.trees=[];
    this.rocks=[];

    this.physics.world.setBounds(0,0,W,H);
    this.cameras.main.setBounds(0,0,W,H);
    this.cameras.main.setBackgroundColor("#082734");

    this.createTextures();
    this.drawWorld();
    this.placeStaticProps();
    this.createActors();
    this.createUI();
    this.setupDomControls();
    this.loadSave();

    this.cameras.main.startFollow(this.player,true,.08,.08);
    this.updateResponsiveView();
    this.layout();
    this.scale.on("resize",()=>{
      this.layout();
      this.updateResponsiveView();
    });

    this.input.keyboard?.on("keydown-E",()=>this.actionUse());
    this.toast("Ithaque a été refaite. Explore, équipe-toi et prends la mer.");
  }

  createTextures(){
    // Hero
    const pg=this.make.graphics({add:false});
    pg.fillStyle(0x1c2230,1).fillCircle(18,9,10);
    pg.fillStyle(0xc88f61,1).fillCircle(18,19,9);
    pg.fillStyle(0xb44634,1).fillRect(8,28,20,25);
    pg.fillStyle(0x6a432a,1).fillRect(4,31,5,23);
    pg.fillStyle(0xdbc37f,1).fillRect(9,53,7,16);
    pg.fillStyle(0xd7c17a,1).fillRect(21,53,7,16);
    pg.fillStyle(0x7a5432,1).fillRect(8,66,8,4);
    pg.fillStyle(0x7a5432,1).fillRect(20,66,8,4);
    pg.fillStyle(0x75502f,1).fillRect(30,32,4,22);
    pg.generateTexture("hero",36,72);
    pg.destroy();

    // Ship
    const sg=this.make.graphics({add:false});
    sg.fillStyle(0x000000,.18).fillEllipse(54,60,84,18);
    sg.fillStyle(0x61381d,1).fillEllipse(54,38,100,40);
    sg.fillStyle(0x8a5731,1).fillTriangle(8,38,100,38,54,68);
    sg.fillStyle(0x4a2a16,1).fillRect(10,36,88,6);
    sg.fillStyle(0xece4c9,1).fillTriangle(54,34,54,-14,92,26);
    sg.fillStyle(0xc9b88a,1).fillRect(51,-18,6,56);
    sg.fillStyle(0xffffff,.45).fillRect(55,0,2,28);
    sg.generateTexture("ship",108,72);
    sg.destroy();

    // Trees
    const tg=this.make.graphics({add:false});
    tg.fillStyle(0x000000,.16).fillEllipse(34,62,52,14);
    tg.fillStyle(0x67452a,1).fillRect(30,34,8,26);
    tg.fillStyle(0x214b35,1).fillCircle(32,26,18);
    tg.fillStyle(0x2d5d41,1).fillCircle(20,28,15);
    tg.fillStyle(0x396d4d,1).fillCircle(41,24,14);
    tg.fillStyle(0x527f60,.7).fillCircle(25,20,8);
    tg.generateTexture("treeA",68,72);
    tg.destroy();

    const tg2=this.make.graphics({add:false});
    tg2.fillStyle(0x000000,.16).fillEllipse(34,62,54,14);
    tg2.fillStyle(0x644328,1).fillRect(30,33,8,27);
    tg2.fillStyle(0x2a573e,1).fillCircle(27,24,16);
    tg2.fillStyle(0x355f45,1).fillCircle(41,30,15);
    tg2.fillStyle(0x234b35,1).fillCircle(18,35,13);
    tg2.fillStyle(0x456f53,.7).fillCircle(34,20,8);
    tg2.generateTexture("treeB",68,72);
    tg2.destroy();

    // Rock
    const rg=this.make.graphics({add:false});
    rg.fillStyle(0x000000,.18).fillEllipse(28,34,42,12);
    rg.fillStyle(0x6a706f,1).fillPoints([new Phaser.Geom.Point(10,25),new Phaser.Geom.Point(18,8),new Phaser.Geom.Point(38,10),new Phaser.Geom.Point(48,22),new Phaser.Geom.Point(42,34),new Phaser.Geom.Point(18,32)], true);
    rg.fillStyle(0x9aa19f,.65).fillPoints([new Phaser.Geom.Point(18,14),new Phaser.Geom.Point(34,13),new Phaser.Geom.Point(28,24),new Phaser.Geom.Point(16,23)], true);
    rg.generateTexture("rock",56,40);
    rg.destroy();

    // Cliff chunk
    const cg=this.make.graphics({add:false});
    cg.fillStyle(0x000000,.18).fillEllipse(56,76,92,18);
    cg.fillStyle(0x70593d,1).fillRect(12,30,88,38);
    cg.fillStyle(0x8fa56f,1).fillRoundedRect(8,12,96,24,4);
    cg.fillStyle(0xc9d59f,.55).fillRect(14,16,66,6);
    cg.fillStyle(0x5a422d,1).fillRect(16,52,4,12);
    cg.fillStyle(0x5a422d,1).fillRect(30,48,4,18);
    cg.fillStyle(0x5a422d,1).fillRect(52,50,4,16);
    cg.fillStyle(0x5a422d,1).fillRect(74,47,4,19);
    cg.generateTexture("cliff",112,84);
    cg.destroy();

    // Buildings
    const forge=this.make.graphics({add:false});
    forge.fillStyle(0x000000,.18).fillEllipse(80,140,128,18);
    forge.fillStyle(0xd4c7ab,1).fillRoundedRect(22,58,116,72,6);
    forge.fillStyle(0x975f38,1).fillTriangle(12,62,80,12,148,62);
    forge.fillStyle(0x5a3b2a,1).fillRect(68,92,20,38);
    forge.fillStyle(0x492f21,1).fillRect(108,76,16,54);
    forge.fillStyle(0xea8744,1).fillCircle(118,112,9);
    forge.fillStyle(0x6b4b37,1).fillRect(24,84,22,16);
    forge.fillStyle(0xd5d0c8,1).fillRect(26,86,18,12);
    forge.generateTexture("forge",160,152);
    forge.destroy();

    const market=this.make.graphics({add:false});
    market.fillStyle(0x000000,.18).fillEllipse(90,142,138,18);
    market.fillStyle(0xd7c9a4,1).fillRoundedRect(18,64,140,66,6);
    market.fillStyle(0xb44738,1).fillTriangle(8,68,88,16,168,68);
    market.fillStyle(0xffffff,.88).fillRect(24,70,26,18);
    market.fillStyle(0xb44738,.85).fillRect(50,70,26,18);
    market.fillStyle(0xffffff,.88).fillRect(76,70,26,18);
    market.fillStyle(0xb44738,.85).fillRect(102,70,26,18);
    market.fillStyle(0xffffff,.88).fillRect(128,70,26,18);
    market.fillStyle(0x70513b,1).fillRect(78,96,20,34);
    market.fillStyle(0xc4994d,1).fillRect(30,103,32,12);
    market.fillStyle(0x88b96b,1).fillRect(110,103,30,12);
    market.generateTexture("market",176,154);
    market.destroy();

    const temple=this.make.graphics({add:false});
    temple.fillStyle(0x000000,.18).fillEllipse(104,165,160,20);
    temple.fillStyle(0xd9d3bf,1).fillRoundedRect(18,72,172,76,6);
    temple.fillStyle(0xc4b58c,1).fillTriangle(8,76,104,18,200,76);
    temple.fillStyle(0xece8dc,1).fillRect(34,82,16,66);
    temple.fillStyle(0xece8dc,1).fillRect(66,82,16,66);
    temple.fillStyle(0xece8dc,1).fillRect(98,82,16,66);
    temple.fillStyle(0xece8dc,1).fillRect(130,82,16,66);
    temple.fillStyle(0xece8dc,1).fillRect(162,82,16,66);
    temple.fillStyle(0xc2b48d,1).fillRect(88,118,32,30);
    temple.generateTexture("temple",208,176);
    temple.destroy();

    const bush=this.make.graphics({add:false});
    bush.fillStyle(0x000000,.14).fillEllipse(30,26,42,10);
    bush.fillStyle(0x2a573d,1).fillCircle(16,16,12);
    bush.fillStyle(0x3f6e50,1).fillCircle(28,13,13);
    bush.fillStyle(0x355f45,1).fillCircle(40,18,11);
    bush.generateTexture("bush",60,34);
    bush.destroy();
  }

  drawWorld(){
    this.waterG=this.add.graphics();
    this.worldG=this.add.graphics();

    // Water layers
    this.waterG.fillStyle(0x082734,1).fillRect(0,0,W,H);
    this.waterG.fillStyle(0x0e3946,.95).fillEllipse(860,930,2100,1600);
    this.waterG.fillStyle(0x165265,.82).fillEllipse(860,930,1820,1380);
    this.waterG.fillStyle(0x247182,.75).fillEllipse(860,930,1540,1160);
    this.waterG.fillStyle(0x3e8f97,.55).fillEllipse(860,930,1330,1010);

    // Coast / beach / inner land
    this.worldG.fillStyle(0xd1c287,1).fillEllipse(860,930,1280,1000);
    this.worldG.fillStyle(0x5f8a5f,1).fillEllipse(860,910,1140,860);

    // Shore cuts / inlets
    const cuts = [
      [265,700,270,230,0x20636d],[1440,800,300,280,0x20636d],[690,1450,340,220,0x20636d],
      [1160,470,280,230,0x20636d],[425,1210,180,150,0x2f8d95]
    ];
    cuts.forEach(([x,y,w,h,c])=>{
      this.worldG.fillStyle(c,1).fillEllipse(x,y,w,h);
      this.worldG.fillStyle(0x0d3d4b,.95).fillEllipse(x,y,w-65,h-65);
    });

    // Roads with outline/highlight
    const drawCubicPath = (g, points, width, color) => {
      const [x0,y0,x1,y1,x2,y2,x3,y3] = points;
      g.lineStyle(width,color,1);
      g.beginPath();
      g.moveTo(x0,y0);
      const steps=34;
      for(let i=1;i<=steps;i++){
        const t=i/steps, mt=1-t;
        const x=(mt*mt*mt*x0)+(3*mt*mt*t*x1)+(3*mt*t*t*x2)+(t*t*t*x3);
        const y=(mt*mt*mt*y0)+(3*mt*mt*t*y1)+(3*mt*t*t*y2)+(t*t*t*y3);
        g.lineTo(x,y);
      }
      g.strokePath();
    };
    const roadCurves = [
      [500,1180,650,1070,790,930,960,770],
      [960,770,1120,735,1260,810,1368,950],
      [806,940,730,792,680,658,635,530],
      [400,1260,360,1210,315,1150,285,1088]
    ];
    roadCurves.forEach(c=>drawCubicPath(this.worldG,c,66,0x988457));
    roadCurves.forEach(c=>drawCubicPath(this.worldG,c,48,0xbea66b));

    // Relief: elevated plateaus using cliff sprites later, add top terrain patches
    this.worldG.fillStyle(0x6b966a,1).fillEllipse(620,620,300,190);
    this.worldG.fillStyle(0x6b966a,1).fillEllipse(1180,900,350,220);
    this.worldG.fillStyle(0x6b966a,1).fillEllipse(560,1210,220,150);

    // Foam along coast
    this.foam=[];
    for(let i=0;i<80;i++){
      const a=(Math.PI*2/80)*i;
      const x=860+Math.cos(a)*615+Phaser.Math.Between(-40,40);
      const y=930+Math.sin(a)*470+Phaser.Math.Between(-32,32);
      const arc=this.add.arc(x,y,Phaser.Math.Between(10,22),200,340,false,0xf3edd5,.2).setDepth(2);
      arc.baseX=x; arc.baseY=y; arc.phase=Math.random()*6.28;
      this.foam.push(arc);
    }

    // Animated waves
    this.waves=[];
    for(let i=0;i<56;i++){
      const wave=this.add.arc(Phaser.Math.Between(0,W),Phaser.Math.Between(0,H),Phaser.Math.Between(12,28),205,335,false,0xbfe8e9,.14)
        .setDepth(1);
      wave.speed=Phaser.Math.FloatBetween(6,18);
      this.waves.push(wave);
    }

    this.landZone=new Phaser.Geom.Ellipse(860,930,1180,900);
    this.dockPoint=new Phaser.Math.Vector2(478,1080);
    this.shipPoint=new Phaser.Math.Vector2(472,1258);
  }

  placeStaticProps(){
    this.propLayer = this.add.layer();
    this.obstacles=[];

    // Relief cliffs
    const cliffs = [
      [560,590],[700,620],[1080,875],[1230,918],[532,1208]
    ];
    cliffs.forEach(([x,y])=>{
      const c=this.add.image(x,y,"cliff").setDepth(y+10);
      this.propLayer.add(c);
      this.obstacles.push({type:"ellipse",x,y:y+10,rx:40,ry:18});
    });

    // Port details
    const dockG=this.add.graphics().setDepth(1150);
    dockG.fillStyle(0x724d2b,1).fillRect(300,1120,360,48);
    dockG.fillRect(458,1080,56,210);
    dockG.fillStyle(0xa8834f,1);
    for(let x=314;x<645;x+=40) dockG.fillRect(x,1128,6,32);
    dockG.fillStyle(0x4d341d,1);
    [314,360,406,452,498,544,590,636].forEach(x=>dockG.fillRect(x,1160,8,24));
    dockG.fillCircle(330,1130,7); dockG.fillCircle(628,1130,7);

    // Buildings sprites
    this.buildings = [
      {x:760,y:877,w:110,h:80,name:"Forgeron",type:"forge",interactX:760,interactY:928,texture:"forge"},
      {x:1148,y:717,w:124,h:82,name:"Marché",type:"market",interactX:1148,interactY:812,texture:"market"},
      {x:962,y:545,w:145,h:105,name:"Temple d’Athéna",type:"temple",interactX:962,interactY:640,texture:"temple"}
    ];
    this.buildings.forEach((b)=>{
      const shadow=this.add.ellipse(b.x,b.y+76,b.w*1.15,22,0x000000,.15).setDepth(b.y-1);
      const img=this.add.image(b.x,b.y,b.texture).setDepth(b.y+20).setScale(b.texture==="temple"?0.92:0.84);
      const lbl=this.add.text(b.x,b.y+72,b.name,{fontFamily:"system-ui",fontSize:"12px",fontStyle:"bold",color:"#f4e3ad",backgroundColor:"#071b23bb",padding:{x:5,y:3}})
        .setOrigin(.5).setDepth(b.y+50);
      this.propLayer.add([shadow,img,lbl]);
      this.obstacles.push({type:"rect",x:b.x-(b.w/2),y:b.y-20,w:b.w,h:b.h});
    });

    // Trees
    const treeData = [
      [270,780,"treeA"],[445,640,"treeB"],[570,520,"treeA"],[760,520,"treeB"],[1270,630,"treeA"],[1370,1035,"treeB"],
      [1120,1175,"treeA"],[865,1290,"treeB"],[620,1365,"treeA"],[340,1030,"treeB"],[1020,1115,"treeA"],[1210,500,"treeB"],
      [1380,760,"treeB"],[770,1090,"treeA"],[930,435,"treeB"],[1110,1300,"treeA"],[1460,910,"treeA"],[540,860,"treeB"]
    ];
    treeData.forEach(([x,y,key])=>{
      const t=this.add.image(x,y,key).setDepth(y+10);
      this.propLayer.add(t);
      this.trees.push(t);
      this.obstacles.push({type:"circle",x,y:y+12,r:18});
    });

    // Bushes / rocks
    const bushes = [[970,815],[1010,850],[669,993],[890,710],[1280,850],[600,770],[750,1390]];
    bushes.forEach(([x,y])=>{
      const b=this.add.image(x,y,"bush").setDepth(y);
      this.propLayer.add(b);
    });
    const rocks = [[676,680],[1320,1120],[470,560],[1140,462],[365,1270],[910,1180]];
    rocks.forEach(([x,y])=>{
      const r=this.add.image(x,y,"rock").setDepth(y);
      this.propLayer.add(r);
      this.obstacles.push({type:"circle",x,y,r:16});
    });
  }

  createActors(){
    this.ship=this.physics.add.image(this.shipPoint.x,this.shipPoint.y,"ship").setDepth(1205).setImmovable(true);
    this.ship.body.setCircle(26,26,18);

    this.player=this.physics.add.image(520,1060,"hero").setDepth(1300).setCollideWorldBounds(true);
    this.player.body.setCircle(14,4,28);

    this.physics.add.collider(this.player,this.ship);
  }

  createUI(){
    this.hudBg=this.add.rectangle(12,12,286,70,0x06171e,.82).setOrigin(0).setScrollFactor(0).setDepth(2000);
    this.hud=this.add.text(24,22,"",{fontFamily:"system-ui",fontSize:"16px",fontStyle:"bold",color:"#f4df9b"}).setScrollFactor(0).setDepth(2001);
    this.modeText=this.add.text(24,51,"",{fontFamily:"system-ui",fontSize:"13px",fontStyle:"bold",color:"#a6d3ce"}).setScrollFactor(0).setDepth(2001);

    this.messageBg=this.add.rectangle(0,0,10,10,0x06171e,.9).setScrollFactor(0).setDepth(2200).setVisible(false);
    this.message=this.add.text(0,0,"",{fontFamily:"system-ui",fontSize:"15px",color:"#fff",align:"center",wordWrap:{width:360}})
      .setOrigin(.5).setScrollFactor(0).setDepth(2201).setVisible(false);

    this.inventoryPanel=this.add.rectangle(0,0,360,280,0x06171e,.96).setStrokeStyle(3,0xd9c279,1).setScrollFactor(0).setDepth(2300).setVisible(false);
    this.inventoryText=this.add.text(0,0,"",{fontFamily:"system-ui",fontSize:"16px",color:"#f6e6b3",lineSpacing:12})
      .setOrigin(.5).setScrollFactor(0).setDepth(2301).setVisible(false);
  }

  setupDomControls(){
    const controls=document.getElementById("mobileControls");
    const base=document.getElementById("joystickBase");
    const knob=document.getElementById("joystickKnob");
    const action=document.getElementById("domActionButton");
    const inventory=document.getElementById("domInventoryButton");

    controls.classList.add("visible");
    this.domControls={controls,base,knob,action,inventory};

    const updateFromPoint=(clientX,clientY)=>{
      const rect=base.getBoundingClientRect();
      const cx=rect.left+rect.width/2;
      const cy=rect.top+rect.height/2;
      const dx=clientX-cx;
      const dy=clientY-cy;
      const length=Math.hypot(dx,dy)||1;
      const max=rect.width*.34;
      const distance=Math.min(length,max);
      const nx=dx/length;
      const ny=dy/length;
      this.joy.x=nx*(distance/max);
      this.joy.y=ny*(distance/max);
      knob.style.transform=`translate3d(${nx*distance}px,${ny*distance}px,0)`;
    };

    const resetJoystick=()=>{
      this.joy.active=false;
      this.joy.id=null;
      this.joy.x=0;
      this.joy.y=0;
      knob.style.transform="translate3d(0,0,0)";
    };

    const pointerDown=(event)=>{
      event.preventDefault();
      event.stopPropagation();
      this.joy.active=true;
      this.joy.id=event.pointerId;
      base.setPointerCapture?.(event.pointerId);
      updateFromPoint(event.clientX,event.clientY);
    };
    const pointerMove=(event)=>{
      if(!this.joy.active||event.pointerId!==this.joy.id) return;
      event.preventDefault();
      updateFromPoint(event.clientX,event.clientY);
    };
    const pointerEnd=(event)=>{
      if(event.pointerId!==this.joy.id) return;
      event.preventDefault();
      resetJoystick();
    };

    base.addEventListener("pointerdown",pointerDown,{passive:false});
    base.addEventListener("pointermove",pointerMove,{passive:false});
    base.addEventListener("pointerup",pointerEnd,{passive:false});
    base.addEventListener("pointercancel",pointerEnd,{passive:false});
    base.addEventListener("lostpointercapture",resetJoystick);

    base.addEventListener("touchstart",(event)=>{
      event.preventDefault();
      const touch=event.changedTouches[0];
      this.joy.active=true;
      this.joy.id="touch";
      updateFromPoint(touch.clientX,touch.clientY);
    },{passive:false});
    base.addEventListener("touchmove",(event)=>{
      if(!this.joy.active) return;
      event.preventDefault();
      const touch=event.changedTouches[0];
      updateFromPoint(touch.clientX,touch.clientY);
    },{passive:false});
    base.addEventListener("touchend",(event)=>{event.preventDefault(); resetJoystick();},{passive:false});
    base.addEventListener("touchcancel",resetJoystick,{passive:false});

    const actionHandler=(event)=>{ event.preventDefault(); event.stopPropagation(); this.actionUse(); };
    const inventoryHandler=(event)=>{ event.preventDefault(); event.stopPropagation(); this.toggleInventory(); };
    action.addEventListener("pointerup",actionHandler,{passive:false});
    action.addEventListener("touchend",actionHandler,{passive:false});
    inventory.addEventListener("pointerup",inventoryHandler,{passive:false});
    inventory.addEventListener("touchend",inventoryHandler,{passive:false});
  }

  updateResponsiveView(){
    const landscape=this.scale.width>this.scale.height;
    const zoom=landscape ? (this.scale.height<500 ? .80 : .90) : .74;
    this.cameras.main.setZoom(zoom);
  }

  layout(){
    const w=this.scale.width,h=this.scale.height;
    const landscape=w>h;
    this.messageBg.setPosition(w/2,landscape?68:110).setSize(Math.min(430,w-24),58);
    this.message.setPosition(w/2,landscape?68:110);
    this.inventoryPanel.setPosition(w/2,h/2).setSize(Math.min(420,w-40),Math.min(300,h-40));
    this.inventoryText.setPosition(w/2,h/2);
  }

  toggleInventory(){
    const show=!this.inventoryPanel.visible;
    this.inventoryPanel.setVisible(show);
    this.inventoryText.setVisible(show);
    this.inventoryText.setText(
      "INVENTAIRE\n\n"+
      `Épée de bronze : ${this.inventory.sword?"équipée":"—"}\n`+
      `Bouclier rond : ${this.inventory.shield?"équipé":"—"}\n`+
      `Casque corinthien : ${this.inventory.helmet?"équipé":"—"}\n\n`+
      `Drachmes : ${this.coins}\nVivres : ${this.food}\nBois : ${this.wood}\n\nTouchez 🎒 pour fermer`
    );
  }

  actionUse(){
    if(this.inventoryPanel.visible){ this.toggleInventory(); return; }

    if(this.mode==="land"){
      const ds=Phaser.Math.Distance.Between(this.player.x,this.player.y,this.ship.x,this.ship.y);
      if(ds<120){
        this.mode="sea";
        this.player.setVisible(false);
        this.player.body.enable=false;
        this.ship.body.immovable=false;
        this.cameras.main.startFollow(this.ship,true,.08,.08);
        this.toast("Tu prends la mer. Reviens au ponton pour débarquer.");
        this.save();
        return;
      }

      const forge = Phaser.Math.Distance.Between(this.player.x,this.player.y,760,928)<130;
      if(forge){
        if(!this.inventory.sword && this.coins>=50){
          this.coins-=50; this.inventory.sword=true; this.toast("Épée de bronze achetée et équipée.");
        }else if(this.inventory.sword){
          this.toast("Le forgeron prépare bientôt de nouvelles armes.");
        }else{
          this.toast("Il te faut 50 drachmes.");
        }
        this.save(); return;
      }

      const market = Phaser.Math.Distance.Between(this.player.x,this.player.y,1148,812)<150;
      if(market){
        if(this.coins>=20){
          this.coins-=20; this.food+=8; this.toast("8 vivres achetés pour 20 drachmes.");
        }else{
          this.toast("Pas assez de drachmes.");
        }
        this.save(); return;
      }

      const temple = Phaser.Math.Distance.Between(this.player.x,this.player.y,962,640)<150;
      if(temple){ this.toast("Athéna veille peut-être sur toi… ou peut-être pas."); return; }

      this.toast("Approche-toi d’un lieu ou du navire.");
    }else{
      const d=Phaser.Math.Distance.Between(this.ship.x,this.ship.y,this.dockPoint.x,this.dockPoint.y);
      if(d<150){
        this.mode="land";
        this.ship.setVelocity(0,0);
        this.ship.body.immovable=true;
        this.player.setPosition(520,1060).setVisible(true);
        this.player.body.enable=true;
        this.cameras.main.startFollow(this.player,true,.08,.08);
        this.toast("Débarquement à Ithaque.");
        this.save();
      }else{
        this.toast("Reviens près du ponton.");
      }
    }
  }

  save(){
    const data={coins:this.coins,food:this.food,wood:this.wood,inventory:this.inventory};
    localStorage.setItem(SAVE_KEY,JSON.stringify(data));
  }

  loadSave(){
    try{
      const data=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
      if(!data) return;
      this.coins=data.coins ?? this.coins;
      this.food=data.food ?? this.food;
      this.wood=data.wood ?? this.wood;
      this.inventory={...this.inventory,...(data.inventory||{})};
    }catch(e){}
  }

  collidesWithObstacles(x,y){
    for(const o of this.obstacles){
      if(o.type==="rect"){
        if(x>o.x && x<o.x+o.w && y>o.y && y<o.y+o.h) return true;
      }else if(o.type==="circle"){
        if(Phaser.Math.Distance.Between(x,y,o.x,o.y) < o.r) return true;
      }else if(o.type==="ellipse"){
        const dx=(x-o.x)/o.rx;
        const dy=(y-o.y)/o.ry;
        if(dx*dx+dy*dy <= 1) return true;
      }
    }
    return false;
  }

  toast(text){
    this.message.setText(text).setVisible(true);
    this.messageBg.setVisible(true);
    clearTimeout(this.toastTimer);
    this.toastTimer=setTimeout(()=>{
      if(this.message){
        this.message.setVisible(false);
        this.messageBg.setVisible(false);
      }
    },2400);
  }

  update(time,delta){
    this.dayT += delta*0.00003;

    for(const wave of this.waves){
      wave.x += wave.speed*delta/1000;
      if(wave.x > W+40) wave.x = -40;
    }
    for(const foam of this.foam){
      foam.alpha = 0.11 + ((Math.sin(this.dayT*2 + foam.phase)+1)/2)*0.16;
      foam.y = foam.baseY + Math.sin(this.dayT*4 + foam.phase)*2.5;
    }
    for(let i=0;i<this.trees.length;i++){
      const tree=this.trees[i];
      tree.x += Math.sin(this.dayT*2 + i)*0.06;
    }

    let x=this.joy.x, y=this.joy.y;
    const len=Math.hypot(x,y);
    if(len>1){ x/=len; y/=len; }

    if(this.mode==="land"){
      this.player.setVelocity(x*this.speed,y*this.speed);
      if(Math.abs(x)>.05) this.player.setFlipX(x<0);

      if(!this.landZone.contains(this.player.x,this.player.y)){
        const c=new Phaser.Math.Vector2(860,930);
        const p=new Phaser.Math.Vector2(this.player.x,this.player.y).subtract(c).normalize();
        this.player.x -= p.x*9;
        this.player.y -= p.y*9;
        this.player.setVelocity(0,0);
      }

      if(this.collidesWithObstacles(this.player.x,this.player.y)){
        this.player.x -= x*10;
        this.player.y -= y*10;
        this.player.setVelocity(0,0);
      }

      this.player.setDepth(this.player.y+80);
    }else{
      this.ship.setVelocity(x*this.shipSpeed,y*this.shipSpeed);
      if(len>.07) this.ship.rotation = Math.atan2(y,x)+Math.PI/2;
      if(this.landZone.contains(this.ship.x,this.ship.y) && Phaser.Math.Distance.Between(this.ship.x,this.ship.y,this.shipPoint.x,this.shipPoint.y)>160){
        this.ship.x -= x*12;
        this.ship.y -= y*12;
        this.ship.setVelocity(0,0);
      }
      this.ship.setDepth(this.ship.y+35);
    }

    this.hud.setText(`◈ ${this.coins}   🍞 ${this.food}   🪵 ${this.wood}`);
    this.modeText.setText(this.mode==="land" ? "ITHAQUE — EXPLORATION" : "MER IONIENNE — NAVIGATION");
  }
}

const config = {
  type: Phaser.AUTO,
  parent: "game",
  backgroundColor: "#06171e",
  scale: {mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH, width: innerWidth, height: innerHeight},
  physics: {default:"arcade", arcade:{gravity:{x:0,y:0}, debug:false}},
  render: {antialias:false, pixelArt:true, roundPixels:true},
  scene: [BootScene, WorldScene]
};

const game = new Phaser.Game(config);
let gameStarted = false;

function showFatal(error){
  const box=document.getElementById("fatalError");
  box.style.display="block";
  document.getElementById("mobileControls")?.classList.remove("visible");
  box.textContent="Le jeu a rencontré une erreur :\n\n"+(error?.stack||error);
}

function startGame(event){
  if(event){
    event.preventDefault();
    event.stopPropagation();
  }
  if(gameStarted) return;
  gameStarted = true;

  const title=document.getElementById("titleScreen");
  title.classList.add("hidden");

  document.documentElement.requestFullscreen?.().catch?.(()=>{});
  screen.orientation?.lock?.("landscape").catch?.(()=>{});

  try{
    game.scene.start("World");
  }catch(error){
    gameStarted=false;
    title.classList.remove("hidden");
    showFatal(error);
  }
}

const startButton=document.getElementById("startButton");
startButton.addEventListener("pointerup",startGame,{passive:false});
startButton.addEventListener("touchend",startGame,{passive:false});
startButton.addEventListener("click",startGame,{passive:false});

document.getElementById("eraseButton").addEventListener("click",(event)=>{
  event.preventDefault();
  localStorage.removeItem(SAVE_KEY);
  event.currentTarget.textContent="Sauvegarde effacée";
});

window.addEventListener("error",(event)=>{ if(gameStarted) showFatal(event.error||event.message); });
window.addEventListener("unhandledrejection",(event)=>{ if(gameStarted) showFatal(event.reason||"Erreur inconnue"); });

})();
</script>
</body>
</html>
