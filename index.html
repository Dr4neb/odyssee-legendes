<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#06171e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Odyssée — Légendes de l’Égée v1.04.3 Landscape</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06171e;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
    #game{width:100%;height:100%}
    canvas{display:block}
    #boot{position:fixed;inset:0;display:grid;place-items:center;background:#06171e;color:#f4df9b;z-index:100;font-weight:800;letter-spacing:.08em}
    #titleScreen{
      position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;
      align-items:center;justify-content:center;padding:calc(28px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      background:
        repeating-linear-gradient(0deg,transparent 0 61px,rgba(24,77,89,.22) 62px 65px),
        #06171e;color:white;text-align:center;box-sizing:border-box;
    }
    #titleScreen.hidden{display:none}
    .gameTitle{
      margin:0;color:#f2d58a;font:900 clamp(48px,14vw,72px)/.95 Georgia,serif;
      text-shadow:-3px 0 #301e13,0 3px #301e13,3px 0 #301e13,0 -3px #301e13,0 7px 0 rgba(0,0,0,.35);
    }
    .gameSubtitle{margin:24px 0 0;color:#d5e0de;font-size:clamp(17px,5vw,23px);font-weight:900;letter-spacing:.2em}
    .gameVersion{margin:48px 0 0;color:#819ba0;font-size:15px;font-weight:800}
    #startButton{
      width:min(86vw,360px);min-height:72px;margin-top:54px;border:4px solid #f1d889;border-radius:2px;
      background:#98483a;color:#fff;font:900 22px system-ui,-apple-system,sans-serif;
      box-shadow:0 7px 0 #50251e;touch-action:manipulation;-webkit-appearance:none;appearance:none;
    }
    #startButton:active{transform:translateY(4px);box-shadow:0 3px 0 #50251e}
    #eraseButton{
      margin-top:30px;padding:12px 18px;border:0;background:transparent;color:#b7c5c5;
      font:600 15px system-ui,-apple-system,sans-serif;touch-action:manipulation;
    }
    .credit{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));color:#637a7e;font-size:13px}
    #fatalError{
      display:none;position:fixed;inset:0;z-index:200;padding:40px 24px;background:#260d0d;color:#fff;
      white-space:pre-wrap;overflow:auto;font:15px/1.5 monospace;
    }
    #rotateHint{
      display:none;position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;z-index:1600;
      transform:translateX(-50%);padding:9px 14px;border:1px solid rgba(241,216,137,.8);
      border-radius:999px;background:rgba(6,23,30,.92);color:#f4df9b;
      font:800 12px system-ui,-apple-system,sans-serif;pointer-events:none;white-space:nowrap;
    }
    #mobileControls{display:none;position:fixed;inset:0;z-index:1500;pointer-events:none}
    #mobileControls.visible{display:block}
    #joystickBase{
      position:absolute;left:calc(28px + env(safe-area-inset-left));bottom:calc(24px + env(safe-area-inset-bottom));
      width:142px;height:142px;border:4px solid rgba(229,207,135,.9);border-radius:50%;
      background:rgba(6,23,30,.58);box-shadow:inset 0 0 0 2px rgba(255,255,255,.05);
      pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;
    }
    #joystickKnob{
      position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;
      background:rgba(229,207,135,.9);box-shadow:0 5px 14px rgba(0,0,0,.35);pointer-events:none;
      transform:translate3d(0,0,0);
    }
    .domGameButton{
      position:absolute;right:calc(30px + env(safe-area-inset-right));border-radius:50%;
      display:grid;place-items:center;border:4px solid #f1d889;color:#fff;font-weight:900;
      pointer-events:auto;touch-action:manipulation;-webkit-user-select:none;user-select:none;
      box-shadow:0 7px 16px rgba(0,0,0,.35);
    }
    #domActionButton{
      bottom:calc(25px + env(safe-area-inset-bottom));width:124px;height:124px;
      background:rgba(158,63,50,.92);font-size:18px;
    }
    #domInventoryButton{
      right:calc(58px + env(safe-area-inset-right));bottom:calc(166px + env(safe-area-inset-bottom));
      width:62px;height:62px;border-width:3px;background:rgba(37,78,86,.95);font-size:25px;
    }
    .domGameButton:active{transform:scale(.94)}
    @media (orientation:portrait){
      #rotateHint{display:block}
      #joystickBase{width:132px;height:132px;left:18px;bottom:calc(18px + env(safe-area-inset-bottom))}
      #domActionButton{width:116px;height:116px;right:18px;bottom:calc(18px + env(safe-area-inset-bottom))}
      #domInventoryButton{right:45px;bottom:calc(152px + env(safe-area-inset-bottom))}
    }
    @media (orientation:landscape) and (max-height:500px){
      #joystickBase{width:124px;height:124px;left:calc(20px + env(safe-area-inset-left));bottom:calc(15px + env(safe-area-inset-bottom))}
      #joystickKnob{width:56px;height:56px;margin:-28px 0 0 -28px}
      #domActionButton{width:106px;height:106px;right:calc(22px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));font-size:16px}
      #domInventoryButton{width:54px;height:54px;right:calc(48px + env(safe-area-inset-right));bottom:calc(132px + env(safe-area-inset-bottom))}
    }
  </style>
</head>
<body>
<div id="boot">OUVERTURE DES PORTES D’ITHAQUE…</div>
<div id="titleScreen">
  <h1 class="gameTitle">ODYSSÉE</h1>
  <div class="gameSubtitle">LÉGENDES DE L’ÉGÉE</div>
  <div class="gameVersion">ALPHA v1.04.3</div>
  <button id="startButton" type="button">COMMENCER</button>
  <button id="eraseButton" type="button">Effacer la sauvegarde</button>
  <div class="credit">Prototype mobile — Dr4neb</div>
</div>
<div id="fatalError"></div>
<div id="rotateHint">↻ Tourne l’iPhone en paysage</div>
<div id="mobileControls">
  <div id="joystickBase" aria-label="Joystick de déplacement"><div id="joystickKnob"></div></div>
  <button id="domInventoryButton" class="domGameButton" type="button" aria-label="Inventaire">🎒</button>
  <button id="domActionButton" class="domGameButton" type="button">ACTION</button>
</div>
<div id="game"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script>
(() => {
"use strict";

const W=2600,H=1900;
const SAVE_KEY="odyssee_v104_alpha";
const clamp=Phaser.Math.Clamp;

class BootScene extends Phaser.Scene{
  constructor(){super("Boot")}
  create(){
    document.getElementById("boot").style.display="none";
  }
}

class WorldScene extends Phaser.Scene{
  constructor(){super("World")}
  create(){
    this.mode="land";
    this.speed=230; this.shipSpeed=285;
    this.coins=120; this.food=18; this.wood=10;
    this.inventory={sword:false,shield:false,helmet:false};
    this.joy={x:0,y:0,active:false,id:null};
    this.dayT=0;

    this.physics.world.setBounds(0,0,W,H);
    this.cameras.main.setBounds(0,0,W,H);
    this.cameras.main.setBackgroundColor("#072935");

    this.drawWorld();
    this.createTextures();
    this.createActors();
    this.createUI();
    this.setupDomControls();
    this.loadSave();

    this.cameras.main.startFollow(this.player,true,.08,.08);
    this.updateResponsiveView();
    this.layout();
    this.scale.on("resize",()=>{
      this.layout();
      this.updateResponsiveView();
    });

    this.input.keyboard?.on("keydown-E",()=>this.actionUse());
    this.toast("Explore Ithaque. Le navire t’attend au port.");
  }

  drawWorld(){
    this.worldG=this.add.graphics();

    // Mer profonde
    this.worldG.fillStyle(0x072935,1).fillRect(0,0,W,H);

    // Courants statiques
    for(let i=0;i<210;i++){
      const x=Phaser.Math.Between(0,W),y=Phaser.Math.Between(0,H),len=Phaser.Math.Between(35,120);
      this.worldG.lineStyle(2,i%3===0?0x174d5b:0x0b3946,.28);
      this.worldG.lineBetween(x,y,x+len,y+Phaser.Math.Between(-8,8));
    }

    // Hauts-fonds autour de l’île
    this.worldG.fillStyle(0x16606a,.42).fillEllipse(900,940,1500,1250);
    this.worldG.fillStyle(0x2f8581,.45).fillEllipse(900,940,1320,1080);
    this.worldG.fillStyle(0xbda96f,1).fillEllipse(900,940,1220,980);
    this.worldG.fillStyle(0x4c8059,1).fillEllipse(900,920,1120,880);

    // Déformations naturelles de la côte
    const shoreCuts=[[350,700,230,210],[1420,820,240,260],[690,1430,310,210],[1180,470,270,220]];
    shoreCuts.forEach(([x,y,w,h])=>{
      this.worldG.fillStyle(0x2b7880,1).fillEllipse(x,y,w,h);
      this.worldG.fillStyle(0x0c3b48,.8).fillEllipse(x,y,w-60,h-60);
    });

    // Chemins organiques : courbes cubiques échantillonnées en segments.
    const drawCubicPath = (x0,y0,x1,y1,x2,y2,x3,y3,steps=28) => {
      this.worldG.beginPath();
      this.worldG.moveTo(x0,y0);
      for(let i=1;i<=steps;i++){
        const t=i/steps;
        const mt=1-t;
        const x=(mt*mt*mt*x0)+(3*mt*mt*t*x1)+(3*mt*t*t*x2)+(t*t*t*x3);
        const y=(mt*mt*mt*y0)+(3*mt*mt*t*y1)+(3*mt*t*t*y2)+(t*t*t*y3);
        this.worldG.lineTo(x,y);
      }
      this.worldG.strokePath();
    };

    this.worldG.lineStyle(58,0xb69a5d,1);
    drawCubicPath(475,1160,650,1040,760,920,930,760);
    drawCubicPath(925,760,1110,710,1240,790,1360,930);
    drawCubicPath(800,930,720,780,670,650,625,520);

    // Collines
    for(let i=0;i<36;i++){
      const x=Phaser.Math.Between(390,1370),y=Phaser.Math.Between(460,1390);
      if((x>620&&x<1290&&y>500&&y<1040)||(x<650&&y>1080))continue;
      this.worldG.fillStyle(0x315f45,1).fillEllipse(x,y,Phaser.Math.Between(90,180),Phaser.Math.Between(42,90));
      this.worldG.fillStyle(0x72956a,.45).fillEllipse(x-12,y-12,Phaser.Math.Between(45,115),Phaser.Math.Between(20,45));
    }

    // Port
    this.worldG.fillStyle(0x674527,1).fillRect(355,1120,300,42);
    this.worldG.fillRect(540,1085,42,175);
    this.worldG.fillStyle(0xa17a48,1);
    for(let x=365;x<645;x+=36)this.worldG.fillRect(x,1126,5,28);

    // Bâtiments
    this.buildings=[
      {x:700,y:850,w:165,h:112,name:"Forgeron",type:"forge"},
      {x:1040,y:690,w:180,h:120,name:"Marché",type:"market"},
      {x:835,y:515,w:215,h:135,name:"Temple d’Athéna",type:"temple"}
    ];
    this.buildings.forEach((b,i)=>{
      this.worldG.fillStyle(i===2?0xd6cfaf:0xd7bd87,1).fillRoundedRect(b.x,b.y,b.w,b.h,8);
      this.worldG.fillStyle(i===2?0xb4a47a:0x955c35,1).fillTriangle(b.x-12,b.y+8,b.x+b.w/2,b.y-62,b.x+b.w+12,b.y+8);
      this.worldG.fillStyle(0x422b20,1).fillRect(b.x+b.w/2-16,b.y+b.h-45,32,45);
      this.add.text(b.x+b.w/2,b.y+b.h+12,b.name,{fontFamily:"system-ui",fontSize:"13px",color:"#f4e3ad",backgroundColor:"#071b23aa",padding:{x:5,y:3}})
        .setOrigin(.5).setDepth(6);
    });

    // Arbres
    for(let i=0;i<62;i++){
      const x=Phaser.Math.Between(360,1400),y=Phaser.Math.Between(430,1410);
      if((x>610&&x<1290&&y>470&&y<1040)||(x<680&&y>1060))continue;
      this.worldG.fillStyle(0x62432a,1).fillRect(x-5,y,10,28);
      this.worldG.fillStyle(0x234b34,1).fillCircle(x,y-12,22);
      this.worldG.fillStyle(0x3d744e,.8).fillCircle(x-10,y-16,13);
    }

    this.landZone=new Phaser.Geom.Ellipse(900,940,1160,900);
    this.dockPoint=new Phaser.Math.Vector2(550,1080);
    this.shipPoint=new Phaser.Math.Vector2(520,1265);

    // Vagues animées
    this.waves=[];
    for(let i=0;i<45;i++){
      const wave=this.add.arc(Phaser.Math.Between(0,W),Phaser.Math.Between(0,H),Phaser.Math.Between(14,34),200,340,false,0x8bd0d0,.16)
        .setDepth(1);
      wave.speed=Phaser.Math.FloatBetween(8,20);
      this.waves.push(wave);
    }
  }

  createTextures(){
    const sg=this.make.graphics({add:false});
    sg.fillStyle(0x6b3d22).fillEllipse(44,32,88,38);
    sg.fillStyle(0x9d6738).fillTriangle(4,29,84,29,44,59);
    sg.fillStyle(0xe8ddba).fillTriangle(44,27,44,-20,78,22);
    sg.lineStyle(4,0x3b2518).lineBetween(44,-24,44,31);
    sg.generateTexture("ship",90,68);sg.destroy();

    const pg=this.make.graphics({add:false});
    pg.fillStyle(0x20252a).fillCircle(20,10,10);
    pg.fillStyle(0xd7a170).fillCircle(20,18,8);
    pg.fillStyle(0xb64c3a).fillRect(10,25,20,23);
    pg.fillStyle(0xe1c179).fillRect(7,48,8,17);
    pg.fillRect(25,48,8,17);
    pg.fillStyle(0x61402a).fillRect(4,30,5,24);
    pg.generateTexture("hero",40,68);pg.destroy();
  }

  createActors(){
    this.ship=this.physics.add.image(this.shipPoint.x,this.shipPoint.y,"ship").setDepth(20).setImmovable(true);
    this.ship.body.setCircle(27,18,7);
    this.player=this.physics.add.image(540,1060,"hero").setDepth(30).setCollideWorldBounds(true);
    this.player.body.setCircle(16,4,27);
    this.physics.add.collider(this.player,this.ship);
  }

  createUI(){
    this.hudBg=this.add.rectangle(12,12,250,70,0x06171e,.82).setOrigin(0).setScrollFactor(0).setDepth(1000);
    this.hud=this.add.text(24,22,"",{fontFamily:"system-ui",fontSize:"16px",fontStyle:"bold",color:"#f4df9b"}).setScrollFactor(0).setDepth(1001);
    this.modeText=this.add.text(24,51,"",{fontFamily:"system-ui",fontSize:"13px",fontStyle:"bold",color:"#a6d3ce"}).setScrollFactor(0).setDepth(1001);

    this.messageBg=this.add.rectangle(0,0,10,10,0x06171e,.9).setScrollFactor(0).setDepth(1200).setVisible(false);
    this.message=this.add.text(0,0,"",{fontFamily:"system-ui",fontSize:"15px",color:"#fff",align:"center",wordWrap:{width:320}})
      .setOrigin(.5).setScrollFactor(0).setDepth(1201).setVisible(false);

    this.inventoryPanel=this.add.rectangle(0,0,320,260,0x06171e,.96).setStrokeStyle(3,0xd9c279,1).setScrollFactor(0).setDepth(1300).setVisible(false);
    this.inventoryText=this.add.text(0,0,"",{fontFamily:"system-ui",fontSize:"16px",color:"#f6e6b3",lineSpacing:12})
      .setOrigin(.5).setScrollFactor(0).setDepth(1301).setVisible(false);
  }

  setupDomControls(){
    const controls=document.getElementById("mobileControls");
    const base=document.getElementById("joystickBase");
    const knob=document.getElementById("joystickKnob");
    const action=document.getElementById("domActionButton");
    const inventory=document.getElementById("domInventoryButton");

    controls.classList.add("visible");
    this.domControls={controls,base,knob,action,inventory};

    const updateFromPoint=(clientX,clientY)=>{
      const rect=base.getBoundingClientRect();
      const cx=rect.left+rect.width/2;
      const cy=rect.top+rect.height/2;
      const dx=clientX-cx;
      const dy=clientY-cy;
      const length=Math.hypot(dx,dy)||1;
      const max=rect.width*.34;
      const distance=Math.min(length,max);
      const nx=dx/length;
      const ny=dy/length;

      this.joy.x=nx*(distance/max);
      this.joy.y=ny*(distance/max);
      knob.style.transform=`translate3d(${nx*distance}px,${ny*distance}px,0)`;
    };

    const resetJoystick=()=>{
      this.joy.active=false;
      this.joy.id=null;
      this.joy.x=0;
      this.joy.y=0;
      knob.style.transform="translate3d(0,0,0)";
    };

    const pointerDown=(event)=>{
      event.preventDefault();
      event.stopPropagation();
      this.joy.active=true;
      this.joy.id=event.pointerId;
      base.setPointerCapture?.(event.pointerId);
      updateFromPoint(event.clientX,event.clientY);
    };
    const pointerMove=(event)=>{
      if(!this.joy.active||event.pointerId!==this.joy.id)return;
      event.preventDefault();
      updateFromPoint(event.clientX,event.clientY);
    };
    const pointerEnd=(event)=>{
      if(event.pointerId!==this.joy.id)return;
      event.preventDefault();
      resetJoystick();
    };

    base.addEventListener("pointerdown",pointerDown,{passive:false});
    base.addEventListener("pointermove",pointerMove,{passive:false});
    base.addEventListener("pointerup",pointerEnd,{passive:false});
    base.addEventListener("pointercancel",pointerEnd,{passive:false});
    base.addEventListener("lostpointercapture",resetJoystick);

    // Fallback tactile spécifique à Safari iOS.
    base.addEventListener("touchstart",(event)=>{
      event.preventDefault();
      const touch=event.changedTouches[0];
      this.joy.active=true;
      this.joy.id="touch";
      updateFromPoint(touch.clientX,touch.clientY);
    },{passive:false});
    base.addEventListener("touchmove",(event)=>{
      if(!this.joy.active)return;
      event.preventDefault();
      const touch=event.changedTouches[0];
      updateFromPoint(touch.clientX,touch.clientY);
    },{passive:false});
    base.addEventListener("touchend",(event)=>{
      event.preventDefault();
      resetJoystick();
    },{passive:false});
    base.addEventListener("touchcancel",resetJoystick,{passive:false});

    const actionHandler=(event)=>{
      event.preventDefault();
      event.stopPropagation();
      this.actionUse();
    };
    const inventoryHandler=(event)=>{
      event.preventDefault();
      event.stopPropagation();
      this.toggleInventory();
    };
    action.addEventListener("pointerup",actionHandler,{passive:false});
    action.addEventListener("touchend",actionHandler,{passive:false});
    inventory.addEventListener("pointerup",inventoryHandler,{passive:false});
    inventory.addEventListener("touchend",inventoryHandler,{passive:false});
  }

  updateResponsiveView(){
    const landscape=this.scale.width>this.scale.height;
    const zoom=landscape ? (this.scale.height<500?.78:.88) : .72;
    this.cameras.main.setZoom(zoom);
  }

  createJoystick(){
    this.joyBase=this.add.circle(94,this.scale.height-112,68,0x06171e,.6).setStrokeStyle(3,0xe5cf87,.78).setScrollFactor(0).setDepth(1100);
    this.joyKnob=this.add.circle(94,this.scale.height-112,30,0xe5cf87,.84).setScrollFactor(0).setDepth(1101);

    this.input.on("pointerdown",p=>{
      if(p.x>this.scale.width*.58)return;
      this.joy.active=true;this.joy.id=p.id;this.updateJoy(p);
    });
    this.input.on("pointermove",p=>{if(this.joy.active&&p.id===this.joy.id)this.updateJoy(p)});
    const end=p=>{
      if(p.id!==this.joy.id)return;
      this.joy.active=false;this.joy.id=null;this.joy.x=this.joy.y=0;
      this.joyKnob.setPosition(this.joyBase.x,this.joyBase.y);
    };
    this.input.on("pointerup",end);this.input.on("pointerupoutside",end);
  }

  updateJoy(p){
    const dx=p.x-this.joyBase.x,dy=p.y-this.joyBase.y,len=Math.hypot(dx,dy)||1,max=50;
    const dist=Math.min(len,max),nx=dx/len,ny=dy/len;
    this.joy.x=nx*(dist/max);this.joy.y=ny*(dist/max);
    this.joyKnob.setPosition(this.joyBase.x+nx*dist,this.joyBase.y+ny*dist);
  }

  createButtons(){
    this.actionBtn=this.add.circle(this.scale.width-78,this.scale.height-112,55,0x9e3f32,.9).setStrokeStyle(3,0xf1d889,1).setScrollFactor(0).setDepth(1100).setInteractive();
    this.actionTxt=this.add.text(this.actionBtn.x,this.actionBtn.y,"ACTION",{fontFamily:"system-ui",fontSize:"13px",fontStyle:"bold",color:"#fff"})
      .setOrigin(.5).setScrollFactor(0).setDepth(1101);
    this.actionBtn.on("pointerdown",()=>this.actionUse());

    this.invBtn=this.add.circle(this.scale.width-78,this.scale.height-205,34,0x254e56,.92).setStrokeStyle(2,0xbcd9d3,1).setScrollFactor(0).setDepth(1100).setInteractive();
    this.invTxt=this.add.text(this.invBtn.x,this.invBtn.y,"🎒",{fontSize:"20px"}).setOrigin(.5).setScrollFactor(0).setDepth(1101);
    this.invBtn.on("pointerdown",()=>this.toggleInventory());
  }

  layout(){
    const w=this.scale.width,h=this.scale.height;
    const landscape=w>h;
    this.messageBg.setPosition(w/2,landscape?68:112).setSize(Math.min(420,w-24),58);
    this.message.setPosition(w/2,landscape?68:112);
    this.inventoryPanel.setPosition(w/2,h/2).setSize(Math.min(420,w-40),Math.min(280,h-40));
    this.inventoryText.setPosition(w/2,h/2);
  }

  toggleInventory(){
    const show=!this.inventoryPanel.visible;
    this.inventoryPanel.setVisible(show);this.inventoryText.setVisible(show);
    this.inventoryText.setText(
      "INVENTAIRE\n\n"+
      `Épée de bronze : ${this.inventory.sword?"équipée":"—"}\n`+
      `Bouclier rond : ${this.inventory.shield?"équipé":"—"}\n`+
      `Casque corinthien : ${this.inventory.helmet?"équipé":"—"}\n\n`+
      `Drachmes : ${this.coins}\nVivres : ${this.food}\nBois : ${this.wood}\n\nTouchez 🎒 pour fermer`
    );
  }

  actionUse(){
    if(this.inventoryPanel.visible){this.toggleInventory();return}
    if(this.mode==="land"){
      const ds=Phaser.Math.Distance.Between(this.player.x,this.player.y,this.ship.x,this.ship.y);
      if(ds<120){
        this.mode="sea";
        this.player.setVisible(false);this.player.body.enable=false;
        this.ship.body.immovable=false;
        this.cameras.main.startFollow(this.ship,true,.08,.08);
        this.toast("Tu prends la mer. Reviens au ponton pour débarquer.");
        this.save();return;
      }
      const forge=Phaser.Math.Distance.Between(this.player.x,this.player.y,780,905)<135;
      if(forge){
        if(!this.inventory.sword&&this.coins>=50){this.coins-=50;this.inventory.sword=true;this.toast("Épée de bronze achetée et équipée.");}
        else if(this.inventory.sword)this.toast("Le forgeron prépare bientôt de nouvelles armes.");
        else this.toast("Il te faut 50 drachmes.");
        this.save();return;
      }
      const market=Phaser.Math.Distance.Between(this.player.x,this.player.y,1130,810)<145;
      if(market){
        if(this.coins>=20){this.coins-=20;this.food+=8;this.toast("8 vivres achetés pour 20 drachmes.");}
        else this.toast("Pas assez de drachmes.");
        this.save();return;
      }
      const temple=Phaser.Math.Distance.Between(this.player.x,this.player.y,942,620)<150;
      if(temple){this.toast("Athéna veille peut-être sur toi… ou peut-être pas.");return}
      this.toast("Approche-toi d’un lieu ou du navire.");
    }else{
      const d=Phaser.Math.Distance.Between(this.ship.x,this.ship.y,this.dockPoint.x,this.dockPoint.y);
      if(d<150){
        this.mode="land";this.ship.setVelocity(0,0);this.ship.body.immovable=true;
        this.player.setPosition(545,1060).setVisible(true);this.player.body.enable=true;
        this.cameras.main.startFollow(this.player,true,.08,.08);
        this.toast("Débarquement à Ithaque.");this.save();
      }else this.toast("Reviens près du ponton.");
    }
  }

  save(){
    const data={coins:this.coins,food:this.food,wood:this.wood,inventory:this.inventory};
    localStorage.setItem(SAVE_KEY,JSON.stringify(data));
  }

  loadSave(){
    try{
      const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
      if(!d)return;
      this.coins=d.coins??this.coins;this.food=d.food??this.food;this.wood=d.wood??this.wood;
      this.inventory={...this.inventory,...(d.inventory||{})};
    }catch(e){}
  }

  toast(t){
    this.message.setText(t).setVisible(true);this.messageBg.setVisible(true);
    clearTimeout(this.toastTimer);
    this.toastTimer=setTimeout(()=>{if(this.message){this.message.setVisible(false);this.messageBg.setVisible(false)}},2300);
  }

  update(time,delta){
    this.dayT+=delta*.00002;
    const darkness=(Math.sin(this.dayT)+1)/2;
    this.cameras.main.setAlpha(1);

    this.waves.forEach(w=>{
      w.x+=w.speed*delta/1000;
      if(w.x>W+40)w.x=-40;
    });

    let x=this.joy.x,y=this.joy.y;
    const len=Math.hypot(x,y);if(len>1){x/=len;y/=len}

    if(this.mode==="land"){
      this.player.setVelocity(x*this.speed,y*this.speed);
      if(Math.abs(x)>.05)this.player.setFlipX(x<0);

      if(!this.landZone.contains(this.player.x,this.player.y)){
        const c=new Phaser.Math.Vector2(900,940),p=new Phaser.Math.Vector2(this.player.x,this.player.y).subtract(c).normalize();
        this.player.x-=p.x*9;this.player.y-=p.y*9;this.player.setVelocity(0,0);
      }

      this.buildings.forEach(b=>{
        const r=new Phaser.Geom.Rectangle(b.x-20,b.y-75,b.w+40,b.h+100);
        if(r.contains(this.player.x,this.player.y)){
          this.player.x-=x*9;this.player.y-=y*9;this.player.setVelocity(0,0);
        }
      });
    }else{
      this.ship.setVelocity(x*this.shipSpeed,y*this.shipSpeed);
      if(len>.07)this.ship.rotation=Math.atan2(y,x)+Math.PI/2;
      if(this.landZone.contains(this.ship.x,this.ship.y)&&Phaser.Math.Distance.Between(this.ship.x,this.ship.y,this.shipPoint.x,this.shipPoint.y)>160){
        this.ship.x-=x*12;this.ship.y-=y*12;this.ship.setVelocity(0,0);
      }
    }

    this.hud.setText(`◈ ${this.coins}   🍞 ${this.food}   🪵 ${this.wood}`);
    this.modeText.setText(this.mode==="land"?"ITHAQUE — EXPLORATION":"MER IONIENNE — NAVIGATION");
  }
}

const config={
  type:Phaser.AUTO,parent:"game",backgroundColor:"#06171e",
  scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH,width:innerWidth,height:innerHeight},
  physics:{default:"arcade",arcade:{gravity:{x:0,y:0},debug:false}},
  render:{antialias:false,pixelArt:true,roundPixels:true},
  scene:[BootScene,WorldScene]
};
const game=new Phaser.Game(config);
let gameStarted=false;

function startGame(event){
  if(event){
    event.preventDefault();
    event.stopPropagation();
  }
  if(gameStarted)return;
  gameStarted=true;

  const title=document.getElementById("titleScreen");
  title.classList.add("hidden");

  document.documentElement.requestFullscreen?.().catch?.(()=>{});
  screen.orientation?.lock?.("landscape").catch?.(()=>{});

  try{
    game.scene.start("World");
  }catch(error){
    gameStarted=false;
    title.classList.remove("hidden");
    showFatal(error);
  }
}

function showFatal(error){
  const box=document.getElementById("fatalError");
  box.style.display="block";
  document.getElementById("mobileControls")?.classList.remove("visible");
  box.textContent="Le jeu a rencontré une erreur :\n\n"+(error?.stack||error);
}

const startButton=document.getElementById("startButton");
startButton.addEventListener("pointerup",startGame,{passive:false});
startButton.addEventListener("touchend",startGame,{passive:false});
startButton.addEventListener("click",startGame,{passive:false});

document.getElementById("eraseButton").addEventListener("click",(event)=>{
  event.preventDefault();
  localStorage.removeItem(SAVE_KEY);
  event.currentTarget.textContent="Sauvegarde effacée";
});

window.addEventListener("error",(event)=>{
  if(gameStarted)showFatal(event.error||event.message);
});
window.addEventListener("unhandledrejection",(event)=>{
  if(gameStarted)showFatal(event.reason||"Erreur inconnue");
});
})();
</script>
</body>
</html>
